name: Contribution Proposal
description: Propose a change or feature
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Before you start:** Review the repository's `CONTRIBUTING.md` for current guidance.

        Keep this short, specific, and explain the problem the proposed change would solve.

  - type: textarea
    id: what
    attributes:
      label: What do you want to change?
      description: Be specific and concise.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How? (optional)
      description: Brief technical approach if you have one in mind.
    validations:
      required: false
