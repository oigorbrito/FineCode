name: Package Report
description: Report a problematic package in the upstream Pi catalog at pi.dev
labels: ["package-report"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a package listed in the upstream Pi catalog at pi.dev. It is not for FineCode packages. For FineCode core bugs, use the bug report template instead.

        Keep this short, specific, and include links, logs, or screenshots when helpful.

  - type: input
    id: package-name
    attributes:
      label: Package name
      description: The npm package name shown in the upstream pi.dev catalog.
      placeholder: "@scope/package"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Version
      description: The package version shown in the upstream pi.dev catalog.
      placeholder: "0.1.0"
    validations:
      required: false

  - type: dropdown
    id: report-type
    attributes:
      label: What are you reporting?
      options:
        - Malicious or unsafe behavior
        - Impersonation
        - Trademark / TOS Violations
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the concern and include links, logs, or screenshots if helpful.
    validations:
      required: true
